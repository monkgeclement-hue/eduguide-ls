services:
  - type: web
    name: eduguide-ls
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_BACKEND
        value: auto
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: eduguide-documents
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISTRICT
        sync: false
      - key: ADMIN_PHONE
        sync: false
