services:
  - type: web
    name: eduguide-ls
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.2
