# EduGuide LS Data Population Configuration
# This file documents the patterns and rules used by automate-data-population.py

[Career Paths]
# Each pattern can match multiple keywords (regex supported)
# When a programme name matches a pattern, the associated career paths are assigned

Technology & ICT = [
  "Software Developer",
  "Systems Analyst",
  "Database Administrator", 
  "IT Support Specialist",
  "Network Administrator",
  "Data Scientist",
  "Cybersecurity Analyst"
]
Pattern = (computer|it|information technology|software|network|cyber|data science|mobile|web)

Business & Commerce = [
  "Business Analyst",
  "Operations Manager",
  "Business Development Officer",
  "Entrepreneur",
  "Accountant",
  "Financial Analyst"
]
Pattern = (business|management|entrepreneurship|commerce|accounting|finance|banking|investment|hospitality|hotel|tourism)

Creative Arts & Communication = [
  "Journalist",
  "Broadcast Producer",
  "Content Producer",
  "Public Relations Officer",
  "Media Manager"
]
Pattern = (journalism|broadcasting|media|communication|pr|public relation)

Engineering = [
  "Professional Engineer",
  "Engineering Technologist",
  "Project Engineer",
  "Technical Consultant",
  "Systems Engineer"
]
Pattern = (engineering|electrical|electronics|mechanical|civil)

Education = [
  "Teacher",
  "Curriculum Developer",
  "Education Officer",
  "Teaching and Learning Resource Developer"
]
Pattern = (education|teaching|teacher)

Health Sciences = [
  "Nurse",
  "Health Informatics Specialist",
  "Clinical Data Analyst",
  "Health Information Manager",
  "Hospital Administrator"
]
Pattern = (health|nursing|medical|clinical|pharmacy|public health|hospital|informatics)


[Duration Rules by Institution]

Limkokwing University Lesotho {
  degree = "4 years with project"
  diploma = "3 years with attachment"
}

Botho University Lesotho {
  degree = "4 years with attachment"
  diploma = "3 years with attachment"
}

Lerotholi Polytechnic {
  diploma = "3 years with attachment"
}

National University of Lesotho {
  degree = "5 years with attachment and project"
  diploma = "3-4 years"
  masters = "3 years"
}

Lesotho College of Education {
  degree = "3 years"
  diploma = "3 years"
}

Lesotho Agricultural College {
  diploma = "3 years"
}


[Fee Structure Mappings]
# Links institutions to their fee structure JSON files

National University of Lesotho = data/real/fees/nul-fee-structure-2024-2025.json
NUL Institute of Extra Mural Studies (IEMS) = data/real/fees/iems-fee-structure-2026-2027.json
Lesotho College of Education = data/real/fees/lce-fee-structure-2025-2026.json
Centre for Accounting Studies = data/real/fees/cas-fee-structure-partial-2024.json
Paray School of Nursing = data/real/fees/paray-school-of-nursing-2024-2025.json


[Filtering Rules]

# Botho University - Keep only Lesotho offerings
Botho Only Lesotho = true
Keep if mentions = ["Lesotho", "lesotho"]
Filter out if mentions = ["Botswana", "botswana"] AND NOT ["Lesotho", "lesotho"]


[Validation Rules]

# Review status for enriched entries
enriched_review_status = approved

# Source note for audit trail
enriched_source_note = "Auto-enriched from repository evidence and institution rules."

# Minimum careers per programme
min_career_options = 4
max_career_options = 4

# Fields that trigger enrichment need
fields_to_check = ["career_options", "duration"]


[Enrichment Statistics]

# Expected outcomes for tracking
programmes_in_catalogue = 234
botho_programmes_non_lesotho = 1
expected_final_count = 233
expected_enriched_count = 0  # May be 0 if already enriched


[Automation Triggers]

# Run automatically on these conditions:
run_on_new_institution = true
run_before_commit = false
run_on_fee_update = true
run_schedule = manual  # or: daily, weekly, monthly

# Integration hooks
pre_commit_hook = python automate-data-population.py
post_fetch_hook = python automate-data-population.py


[Logging & Audit]

log_file = logs/data-enrichment.log
log_level = INFO
backup_on_change = true
backup_dir = data/backups/

# Tracking
track_enrichment_date = true
track_enrichment_version = true
track_enrichment_user = true
